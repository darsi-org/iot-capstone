# Node-RED for milestone 3, on this computer only.
# No local MQTT broker: a board in Wokwi or on Wi-Fi can't reach this computer's localhost,
# so the board, tools/listen.py and Node-RED all use the public test broker test.mosquitto.org, port 1883.
services:
  node-red:
    image: nodered/node-red:4.0
    ports:
      - "127.0.0.1:1880:1880"
